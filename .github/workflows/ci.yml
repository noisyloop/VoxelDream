name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Zero-binary-assets check
        run: npm run check:no-binaries
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + golden tests
        run: npx vitest run
      - name: Build
        run: npx vite build
